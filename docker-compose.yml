services:
  backend:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - resume_storage:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  resume_storage:
